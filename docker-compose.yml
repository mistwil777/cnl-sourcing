networks:
  cnl_network:
    driver: bridge

volumes:
  postgres_data:
  lancedb_data:
  n8n_data:
  redis_data:
  ollama_data:

services:
  # ─── Nginx (reverse proxy) ────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: cnl_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs
      - n8n
    networks:
      - cnl_network

  # ─── Next.js (frontend + API routes) ─────────────────────────────────────
  nextjs:
    build:
      context: ./frontend
    container_name: cnl_nextjs
    restart: unless-stopped
    volumes:
      - lancedb_data:/app/lancedb_data
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cnl_network

  # ─── PostgreSQL 16 ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cnl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cnl_network

  # ─── n8n (orchestration workflows) ───────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: cnl_n8n
    restart: unless-stopped
    environment:
      # Auth
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # PostgreSQL backend
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${POSTGRES_HOST}
      DB_POSTGRESDB_PORT: ${POSTGRES_PORT}
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # URL et sous-chemin (CRITIQUE pour reverse proxy Nginx sur /n8n/)
      WEBHOOK_URL: https://${DOMAIN}/n8n/
      N8N_HOST: ${DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_PATH: /n8n/
      N8N_EDITOR_BASE_URL: https://${DOMAIN}/n8n/
      # Variables applicatives accessibles via $env dans les workflows
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      # Autoriser l'accès à $env dans les expressions des workflows
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cnl_network

  # ─── Redis (cache + sessions) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cnl_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - cnl_network

  # ─── Ollama — LLM local pour tâches internes (scoring RAG) ───────────────
  ollama:
    image: ollama/ollama:latest
    container_name: cnl_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
      - lancedb_data:/app/lancedb_data
    expose:
      - "11434"
    networks:
      - cnl_network
    # Sans GPU : utiliser phi3:mini (~2GB) ou llama3.2:1b (~1GB)
    # Lancer après démarrage : docker exec cnl_ollama ollama pull phi3:mini
