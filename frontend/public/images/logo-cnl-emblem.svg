<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CNL Sourcing">
  <!-- Cercle extérieur décoratif -->
  <circle cx="160" cy="145" r="118" fill="none" stroke="rgba(201,168,76,0.25)" stroke-width="1.5"/>
  <circle cx="160" cy="145" r="104" fill="none" stroke="rgba(201,168,76,0.12)" stroke-width="1"/>

  <!-- Arc pont France–Vietnam -->
  <circle cx="88"  cy="172" r="5.5" fill="#C9A84C"/>
  <circle cx="232" cy="172" r="5.5" fill="rgba(255,255,255,0.65)"/>
  <path d="M 93 172 Q 160 100 227 172"
        stroke="#C9A84C" stroke-width="2" fill="none"
        stroke-linecap="round" opacity="0.85"/>

  <!-- Texte CNL -->
  <text x="160" y="165"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="64" font-weight="700"
        fill="white"
        letter-spacing="-2">CNL</text>

  <!-- Ligne dorée séparatrice -->
  <rect x="108" y="176" width="104" height="1.5" fill="#C9A84C" rx="1"/>

  <!-- Sous-titre SOURCING -->
  <text x="160" y="196"
        text-anchor="middle"
        font-family="'Arial', 'Helvetica Neue', sans-serif"
        font-size="11.5" font-weight="400"
        letter-spacing="6.5"
        fill="rgba(201,168,76,0.9)">SOURCING</text>

  <!-- Tagline FRANCE · VIETNAM -->
  <text x="160" y="252"
        text-anchor="middle"
        font-family="'Arial', 'Helvetica Neue', sans-serif"
        font-size="9.5" font-weight="300"
        letter-spacing="3.5"
        fill="rgba(255,255,255,0.4)">FRANCE · VIETNAM</text>
</svg>
