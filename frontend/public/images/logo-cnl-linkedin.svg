<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CNL Sourcing">
  <!-- Fond rouge marque -->
  <rect width="400" height="400" fill="#8B1A1A"/>

  <!-- Bordures dorées haut/bas -->
  <rect x="0"   y="0"   width="400" height="3.5" fill="#C9A84C"/>
  <rect x="0"   y="396.5" width="400" height="3.5" fill="#C9A84C"/>

  <!-- Coins dorés (détail élégant) -->
  <rect x="28"  y="28"  width="28" height="2" fill="rgba(201,168,76,0.5)"/>
  <rect x="28"  y="28"  width="2"  height="28" fill="rgba(201,168,76,0.5)"/>
  <rect x="344" y="28"  width="28" height="2" fill="rgba(201,168,76,0.5)"/>
  <rect x="370" y="28"  width="2"  height="28" fill="rgba(201,168,76,0.5)"/>
  <rect x="28"  y="370" width="28" height="2" fill="rgba(201,168,76,0.5)"/>
  <rect x="28"  y="344" width="2"  height="28" fill="rgba(201,168,76,0.5)"/>
  <rect x="344" y="370" width="28" height="2" fill="rgba(201,168,76,0.5)"/>
  <rect x="370" y="344" width="2"  height="28" fill="rgba(201,168,76,0.5)"/>

  <!-- Arc pont France–Vietnam -->
  <circle cx="128" cy="238" r="6.5" fill="#C9A84C"/>
  <circle cx="272" cy="238" r="6.5" fill="rgba(255,255,255,0.7)"/>
  <path d="M 134 238 Q 200 168 266 238"
        stroke="#C9A84C" stroke-width="2.5" fill="none"
        stroke-linecap="round" opacity="0.9"/>

  <!-- Texte CNL -->
  <text x="200" y="232"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="96" font-weight="700"
        fill="white"
        letter-spacing="-4">CNL</text>

  <!-- Ligne dorée -->
  <rect x="128" y="248" width="144" height="2" fill="#C9A84C" rx="1"/>

  <!-- SOURCING -->
  <text x="200" y="272"
        text-anchor="middle"
        font-family="'Arial', 'Helvetica Neue', sans-serif"
        font-size="16" font-weight="400"
        letter-spacing="9"
        fill="#C9A84C">SOURCING</text>

  <!-- FRANCE · VIETNAM -->
  <text x="200" y="320"
        text-anchor="middle"
        font-family="'Arial', 'Helvetica Neue', sans-serif"
        font-size="11" font-weight="300"
        letter-spacing="4"
        fill="rgba(255,255,255,0.45)">FRANCE · VIETNAM</text>
</svg>
