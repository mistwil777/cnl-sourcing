user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Logging ────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens  off;

    # ─── Rate limiting ───────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_chat:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;

    # ─── Docker DNS resolver (résolution dynamique des upstreams) ───────────
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ─── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # ─── Redirect HTTP → HTTPS ───────────────────────────────────────────────
    server {
        listen 80;
        server_name cnlsourcing.com www.cnlsourcing.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── HTTPS principal ─────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name cnlsourcing.com www.cnlsourcing.com;

        # Certificats SSL
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Paramètres SSL modernes
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        # ssl_stapling désactivé (Let's Encrypt ECDSA — pas d'OCSP dans le cert)
        # ssl_stapling        on;
        # ssl_stapling_verify on;

        # ─── En-têtes sécurité ──────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "SAMEORIGIN"                 always;
        add_header X-Content-Type-Options    "nosniff"                    always;
        add_header X-XSS-Protection          "1; mode=block"              always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

        # ─── Rate limiting /api/chat ─────────────────────────────────────────
        location /api/chat {
            limit_req zone=api_chat burst=5 nodelay;
            limit_req_status 429;

            set $upstream_nextjs http://nextjs:3000;
            proxy_pass         $upstream_nextjs;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ─── Rate limiting /api/ ─────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_general burst=20 nodelay;
            limit_req_status 429;

            set $upstream_nextjs http://nextjs:3000;
            proxy_pass         $upstream_nextjs;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ─── n8n (interface admin workflows) ─────────────────────────────────
        # IMPORTANT : proxy_pass SANS slash final = nginx passe le chemin complet
        # (/n8n/assets/foo → http://n8n:5678/n8n/assets/foo)
        # n8n voit /n8n/* et sait qu'il est déployé sous /n8n/ (N8N_PATH=/n8n/)
        location /n8n/ {
            set $upstream_n8n http://n8n:5678;
            proxy_pass         $upstream_n8n;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_buffering    off;
        }

        # ─── Next.js (tout le reste) ──────────────────────────────────────────
        location / {
            set $upstream_nextjs http://nextjs:3000;
            proxy_pass         $upstream_nextjs;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ─── Assets statiques ────────────────────────────────────────────────
        location /_next/static/ {
            set $upstream_nextjs http://nextjs:3000;
            proxy_pass $upstream_nextjs;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
