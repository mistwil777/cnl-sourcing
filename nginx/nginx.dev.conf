user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile       on;
    keepalive_timeout 65;
    server_tokens  off;

    # ─── Rate limiting (conservé en dev pour tester le comportement) ─────────
    limit_req_zone $binary_remote_addr zone=api_chat:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    server {
        listen 80;
        server_name localhost;

        # ─── Rate limiting /api/chat ─────────────────────────────────────────
        location /api/chat {
            limit_req zone=api_chat burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://nextjs:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto http;
            proxy_read_timeout 120s;
        }

        # ─── Rate limiting /api/ ─────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_general burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://nextjs:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto http;
        }

        # ─── n8n ─────────────────────────────────────────────────────────────
        # proxy_pass SANS slash final = chemin complet transmis à n8n
        location /n8n/ {
            proxy_pass         http://n8n:5678;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto http;
            proxy_read_timeout 300s;
            proxy_buffering    off;
        }

        # ─── Next.js ─────────────────────────────────────────────────────────
        location / {
            proxy_pass         http://nextjs:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto http;
        }

        # ─── Assets statiques ────────────────────────────────────────────────
        location /_next/static/ {
            proxy_pass http://nextjs:3000;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
